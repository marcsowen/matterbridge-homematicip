name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts
